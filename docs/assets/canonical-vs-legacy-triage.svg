<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="tblShadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="475" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Canonical ML Triage vs. Legacy Platform Workflows</text>
  <text x="475" y="58" text-anchor="middle" font-size="13" fill="#64748b">Mapping table and coexistence guarantees between modern clinical triage and legacy automated triggers</text>

  <!-- Table Container -->
  <g transform="translate(40, 85)">
    <rect width="870" height="300" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#tblShadow)"/>
    
    <!-- Table Header Row -->
    <rect x="0" y="0" width="870" height="42" rx="8" fill="#f1f5f9"/>
    <text x="30" y="26" font-size="12" font-weight="700" fill="#334155">Canonical Overall Triage</text>
    <text x="230" y="26" font-size="12" font-weight="700" fill="#334155">Legacy Level</text>
    <text x="360" y="26" font-size="12" font-weight="700" fill="#334155">Clinical Meaning &amp; Action</text>
    <text x="640" y="26" font-size="12" font-weight="700" fill="#334155">Referral Trigger</text>
    <text x="760" y="26" font-size="12" font-weight="700" fill="#334155">Follow-Up Schedule</text>
    <line x1="0" y1="42" x2="870" y2="42" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Row 1: LOW -->
    <rect x="0" y="42" width="870" height="60" fill="#f0fdf4"/>
    <rect x="25" y="54" width="80" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/>
    <text x="65" y="71" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">LOW</text>
    <rect x="225" y="54" width="80" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="265" y="71" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">LEVEL 1</text>
    <text x="360" y="68" font-size="11.5" fill="#334155">Low risk / routine healthcare monitoring</text>
    <text x="360" y="86" font-size="10.5" fill="#64748b">No immediate high-risk patterns detected</text>
    <text x="650" y="76" font-size="11.5" font-weight="600" fill="#64748b">None (null)</text>
    <text x="770" y="76" font-size="11.5" font-weight="600" fill="#64748b">None (null)</text>
    <line x1="0" y1="102" x2="870" y2="102" stroke="#e2e8f0"/>

    <!-- Row 2: MODERATE -->
    <rect x="0" y="102" width="870" height="60" fill="#ffffff"/>
    <rect x="25" y="114" width="105" height="26" rx="13" fill="#fef3c7" stroke="#fde68a"/>
    <text x="77" y="131" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">MODERATE</text>
    <rect x="225" y="114" width="80" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="265" y="131" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">LEVEL 2</text>
    <text x="360" y="128" font-size="11.5" fill="#334155">Further PHC / ASHA evaluation recommended</text>
    <text x="360" y="146" font-size="10.5" fill="#64748b">Elevated probability or non-acute symptoms</text>
    <text x="650" y="136" font-size="11.5" font-weight="700" fill="#0284c7">Auto-Created</text>
    <text x="770" y="136" font-size="11.5" font-weight="700" fill="#0284c7">Due in 7 days</text>
    <line x1="0" y1="162" x2="870" y2="162" stroke="#e2e8f0"/>

    <!-- Row 3: HIGH -->
    <rect x="0" y="162" width="870" height="60" fill="#fff7ed"/>
    <rect x="25" y="174" width="85" height="26" rx="13" fill="#ffedd5" stroke="#fed7aa"/>
    <text x="67" y="191" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">HIGH</text>
    <rect x="225" y="174" width="80" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="265" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">LEVEL 3</text>
    <text x="360" y="188" font-size="11.5" fill="#334155">High priority clinical specialist referral required</text>
    <text x="360" y="206" font-size="10.5" fill="#64748b">High ML probability (≥70%) or severe acute signs</text>
    <text x="650" y="196" font-size="11.5" font-weight="700" fill="#c2410c">Auto-Created</text>
    <text x="770" y="196" font-size="11.5" font-weight="700" fill="#c2410c">Due in 3 days</text>
    <line x1="0" y1="222" x2="870" y2="222" stroke="#e2e8f0"/>

    <!-- Row 4: CRITICAL -->
    <rect x="0" y="222" width="870" height="78" fill="#fef2f2"/>
    <rect x="25" y="238" width="95" height="26" rx="13" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="72" y="255" text-anchor="middle" font-size="12" font-weight="800" fill="#be123c">CRITICAL</text>
    <rect x="225" y="238" width="80" height="26" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="265" y="255" text-anchor="middle" font-size="11.5" font-weight="700" fill="#be123c">LEVEL 3</text>
    <text x="360" y="248" font-size="11.5" font-weight="700" fill="#991b1b">Emergency clinical escalation required</text>
    <text x="360" y="266" font-size="10.5" fill="#b91c1c">Extreme bleeding (&gt;20d), blood in stool, severe acute pain</text>
    <text x="360" y="284" font-size="10" font-weight="700" fill="#be123c">★ CANONICAL "CRITICAL" IS NEVER OVERWRITTEN WITH HIGH</text>
    <text x="650" y="256" font-size="11.5" font-weight="700" fill="#b91c1c">Auto-Created</text>
    <text x="770" y="256" font-size="11.5" font-weight="700" fill="#b91c1c">Due in 3 days</text>
  </g>

  <!-- Bottom Clarification Box -->
  <g transform="translate(40, 400)">
    <rect width="870" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#1e293b">Database &amp; Frontend Coexistence Rule:</text>
    <text x="20" y="44" font-size="11.5" fill="#475569">• In the database, <tspan font-family="monospace">overall_prediction = 'CRITICAL'</tspan> is preserved in its own column alongside legacy <tspan font-family="monospace">triage_level = 'LEVEL 3'</tspan>.</text>
    <text x="20" y="62" font-size="11.5" fill="#475569">• The frontend displays the prominent <tspan font-weight="700" fill="#be123c">CRITICAL</tspan> badge to the user while using <tspan font-weight="600">LEVEL 3</tspan> to route dashboard stats and referral cards.</text>
  </g>
</svg>
