<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxGlow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="netArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Deployment Topologies &amp; ML Service Configuration</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">Switch between local microservice and deployed Render cloud service via ML_API_URL</text>

  <!-- Option A: Full Local Stack -->
  <g transform="translate(50, 90)">
    <rect width="420" height="340" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#boxGlow)"/>
    <rect x="0" y="0" width="420" height="38" rx="8" fill="#e2e8f0"/>
    <text x="210" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Option A: Full Local Development Stack</text>

    <!-- Node 1: Browser -->
    <rect x="30" y="55" width="360" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="80" font-size="12" font-weight="700" fill="#0f172a">Browser Client</text>
    <text x="370" y="80" text-anchor="end" font-size="11" font-family="monospace" fill="#64748b">http://localhost:5173</text>

    <!-- Arrow -->
    <path d="M 210 97 L 210 120" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#netArrow)"/>

    <!-- Node 2: Frontend Dev Server -->
    <rect x="30" y="120" width="360" height="50" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="50" y="142" font-size="12" font-weight="700" fill="#0369a1">React Frontend (Vite)</text>
    <text x="50" y="160" font-size="10.5" fill="#0284c7">Host: 127.0.0.1:5173 (Proxies /api/* ➔ :8000)</text>

    <!-- Arrow -->
    <path d="M 210 170 L 210 193" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#netArrow)"/>

    <!-- Node 3: Main Backend -->
    <rect x="30" y="193" width="360" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="50" y="215" font-size="12" font-weight="700" fill="#1e40af">Sanjivani Main Backend (FastAPI)</text>
    <text x="50" y="233" font-size="10.5" fill="#1d4ed8">Host: 127.0.0.1:8000 (Database, Referrals)</text>

    <!-- Arrow -->
    <path d="M 210 243 L 210 266" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#netArrow)"/>

    <!-- Node 4: Local ML Service -->
    <rect x="30" y="266" width="360" height="55" rx="6" fill="#faf5ff" stroke="#ddd6fe"/>
    <text x="50" y="288" font-size="12" font-weight="700" fill="#6b21a8">Standalone ML Microservice (FastAPI)</text>
    <text x="50" y="306" font-size="10.5" font-family="monospace" fill="#5b21b6">ML_API_URL=http://127.0.0.1:8001/predict</text>
  </g>

  <!-- Option B: Hybrid / Deployed Cloud ML Service -->
  <g transform="translate(530, 90)">
    <rect width="420" height="340" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#boxGlow)"/>
    <rect x="0" y="0" width="420" height="38" rx="8" fill="#ede9fe"/>
    <text x="210" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Option B: Cloud-Deployed ML Service</text>

    <!-- Node 1: Browser -->
    <rect x="30" y="55" width="360" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="50" y="80" font-size="12" font-weight="700" fill="#0f172a">Browser Client</text>
    <text x="370" y="80" text-anchor="end" font-size="11" font-family="monospace" fill="#64748b">http://localhost:5173</text>

    <!-- Arrow -->
    <path d="M 210 97 L 210 120" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#netArrow)"/>

    <!-- Node 2: Frontend Dev Server -->
    <rect x="30" y="120" width="360" height="50" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="50" y="142" font-size="12" font-weight="700" fill="#0369a1">React Frontend (Vite)</text>
    <text x="50" y="160" font-size="10.5" fill="#0284c7">Host: 127.0.0.1:5173 (Proxies /api/* ➔ :8000)</text>

    <!-- Arrow -->
    <path d="M 210 170 L 210 193" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#netArrow)"/>

    <!-- Node 3: Main Backend -->
    <rect x="30" y="193" width="360" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="50" y="215" font-size="12" font-weight="700" fill="#1e40af">Sanjivani Main Backend (FastAPI)</text>
    <text x="50" y="233" font-size="10.5" fill="#1d4ed8">Host: 127.0.0.1:8000</text>

    <!-- Arrow with Internet Cloud label -->
    <path d="M 210 243 L 210 266" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3" fill="none" marker-end="url(#netArrow)"/>
    <rect x="150" y="247" width="120" height="18" rx="3" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="210" y="260" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4f46e5">HTTPS Internet</text>

    <!-- Node 4: Render ML Cloud Service -->
    <rect x="30" y="266" width="360" height="55" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="50" y="286" font-size="12" font-weight="700" fill="#a21caf">Render Cloud ML Microservice</text>
    <text x="50" y="306" font-size="9.5" font-family="monospace" fill="#86198f">ML_API_URL=https://sanjivani-backend-hlvg.onrender.com/predict</text>
  </g>

  <!-- Bottom Environment Variable Explanation -->
  <g transform="translate(50, 445)">
    <rect width="900" height="55" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#0f172a">Environment Configuration Rule:</text>
    <text x="20" y="42" font-size="11.5" fill="#475569">The frontend <tspan font-weight="700">never needs to know</tspan> whether ML runs locally or in the cloud. Only the Main Backend's <tspan font-family="monospace" font-weight="700">ML_API_URL</tspan> environment variable dictates the target.</text>
  </g>
</svg>
