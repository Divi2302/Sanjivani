<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShd" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <marker id="greenArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="890" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="475" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="#991b1b">⚠️ CRITICAL ARCHITECTURAL SAFETY: SEMANTIC CYCLE-LENGTH ISOLATION</text>
  <text x="475" y="65" text-anchor="middle" font-size="12" fill="#b91c1c">Why Sanjivani's "cycle_length" and ML Service's "cycle_length" MUST NEVER BE DIRECTLY MAPPED</text>

  <!-- Left: Application Domain Concept -->
  <g transform="translate(50, 105)">
    <rect width="380" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShd)"/>
    <rect x="0" y="0" width="380" height="38" rx="8" fill="#e2e8f0"/>
    <text x="190" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Sanjivani Frontend &amp; Main Backend</text>

    <!-- Field 1: cycle_length -->
    <rect x="20" y="55" width="340" height="75" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="35" y="78" font-size="13" font-weight="700" fill="#991b1b">cycle_length = "21-35 days"</text>
    <text x="35" y="98" font-size="11.5" fill="#475569">• Represents <tspan font-weight="700" fill="#0f172a">Menstrual Cycle Interval</tspan> (Days between periods)</text>
    <text x="35" y="116" font-size="11" fill="#64748b">• Categorical string ("21-35 days", "&gt;35 days", "Varies")</text>

    <!-- Field 2: bleeding_duration_days -->
    <rect x="20" y="145" width="340" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="168" font-size="13" font-weight="700" fill="#166534">bleeding_duration_days = 6</text>
    <text x="35" y="188" font-size="11.5" fill="#15803d">• Represents <tspan font-weight="700" fill="#14532d">Bleeding / Flow Duration</tspan> (Active period days)</text>
    <text x="35" y="206" font-size="11" fill="#166534">• Explicit integer collected from patient (1 to 100 days)</text>
  </g>

  <!-- Right: ML Microservice Domain Concept -->
  <g transform="translate(520, 105)">
    <rect width="380" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShd)"/>
    <rect x="0" y="0" width="380" height="38" rx="8" fill="#ede9fe"/>
    <text x="190" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Standalone ML Microservice (/predict)</text>

    <!-- ML Field: cycle_length -->
    <rect x="20" y="55" width="340" height="165" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="35" y="80" font-size="13" font-weight="700" fill="#6b21a8">cycle_length = 6</text>
    <text x="35" y="102" font-size="11.5" fill="#475569">• Represents <tspan font-weight="700" fill="#0f172a">Bleeding Duration in Days</tspan></text>
    <text x="35" y="122" font-size="11" fill="#64748b">• Kaggle PCOS Dataset column: <tspan font-family="monospace">"Cycle length(days)"</tspan></text>
    <text x="35" y="140" font-size="11" fill="#64748b">• Training distribution: Mean = 4.95 days (Range: 0–12 days)</text>
    <text x="35" y="160" font-size="11" fill="#64748b">• Values &gt; 12 trigger Out-of-Distribution Safety Capping</text>
    <text x="35" y="180" font-size="11" fill="#dc2626" font-weight="600">• Values &gt; 20 trigger CRITICAL Safety Escalation</text>
  </g>

  <!-- Connection Lines & Mappings -->
  <!-- Invalid Cross Line (Red Strikethrough) -->
  <path d="M 360 190 L 540 190" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <circle cx="450" cy="190" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="450" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">✕</text>
  <text x="450" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">DO NOT MAP</text>

  <!-- Valid Correct Line (Green Arrow) -->
  <path d="M 360 280 L 450 280 L 450 240 L 540 240" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#greenArr)"/>
  <rect x="405" y="295" width="140" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="475" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">✓ CORRECT MAPPING</text>

  <!-- Bottom Explanatory Summary Box -->
  <g transform="translate(50, 365)">
    <rect width="850" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="25" y="24" font-size="12" font-weight="700" fill="#1e40af">Why this distinction is vital for patient safety:</text>
    <text x="25" y="44" font-size="11.5" fill="#1e3a8a">1. If the string <tspan font-weight="600">"21-35 days"</tspan> was parsed as number <tspan font-weight="600">21</tspan> or <tspan font-weight="600">35</tspan> and sent as bleeding duration, the safety engine would detect <tspan font-weight="600">extreme bleeding duration (&gt;20 days)</tspan> and inappropriately force a <tspan font-weight="700" fill="#b91c1c">CRITICAL EMERGENCY TRIAGE</tspan> for a healthy woman.</text>
    <text x="25" y="64" font-size="11.5" fill="#1e3a8a">2. If bleeding duration is missing, the system must <tspan font-weight="700">reject the request with HTTP 422</tspan> rather than silently assuming a default of 5 days.</text>
    <text x="25" y="84" font-size="11.5" fill="#1e3a8a">3. <tspan font-weight="600">ml_payload_mapper.py</tspan> strictly enforces: <tspan font-family="monospace">ml_payload["cycle_length"] = assessment.bleeding_duration_days</tspan>.</text>
  </g>
</svg>
